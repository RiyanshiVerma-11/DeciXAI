

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: decisionai-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/models:/app/models
      - ./backend/logs:/app/logs
    env_file:
      - .env
    environment:
      - OLLAMA_API_URL=http://host.docker.internal:11434/v1/chat/completions
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - decisionai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: decisionai-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - decisionai-net

networks:
  decisionai-net:
    driver: bridge
