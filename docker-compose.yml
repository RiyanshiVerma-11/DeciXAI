

services:
  ollama:
    image: ollama/ollama:latest
    container_name: decisionai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - decisionai-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: decisionai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
    env_file:
      - .env
    environment:
      - OLLAMA_API_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    depends_on:
      - ollama
    networks:
      - decisionai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: decisionai-frontend
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - decisionai-net

networks:
  decisionai-net:
    driver: bridge

volumes:
  ollama:
