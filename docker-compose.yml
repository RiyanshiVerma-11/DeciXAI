services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: decisionai-backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend/models:/app/models
    env_file:
      - .env.example
    networks:
      - decisionai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: decisionai-frontend
    ports:
      - '3000:80'
    env_file:
      - .env.example
    depends_on:
      - backend
    networks:
      - decisionai-net

networks:
  decisionai-net:
    driver: bridge
