

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: decisionai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
    env_file:
      - .env
    environment:
      - OLLAMA_API_URL=http://host.docker.internal:11434/v1/chat/completions
      - OLLAMA_MODEL=${OLLAMA_MODEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - decisionai-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: decisionai-frontend
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - decisionai-net

networks:
  decisionai-net:
    driver: bridge
